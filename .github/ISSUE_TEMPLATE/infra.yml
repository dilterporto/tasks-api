name: Infra / Tech Debt
description: Infrastructure change, dependency update or refactoring
labels: ["infra", "p3-normal"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to change and why?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [p1-critical, p2-high, p3-normal]
      default: 2
    validations:
      required: true
