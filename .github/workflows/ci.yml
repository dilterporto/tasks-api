name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  architecture-sensor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: "Check: Application does not reference Persistence (.csproj)"
        run: |
          if grep -r "Tasks.Persistence" src/Tasks.Application/ --include="*.csproj"; then
            echo "VIOLATION: Application must not reference Persistence"
            exit 1
          fi

      - name: "Check: Domain does not reference other layers (.csproj)"
        run: |
          if grep -rE "Tasks\.(Application|Persistence|Api|DependencyInjection)" src/Tasks.Domain/ --include="*.csproj"; then
            echo "VIOLATION: Domain must not reference Application, Persistence, Api, or DependencyInjection"
            exit 1
          fi

      - name: "Check: Api does not reference Persistence directly (.csproj)"
        run: |
          if grep -r "Tasks.Persistence" src/Tasks.Api/ --include="*.csproj"; then
            echo "VIOLATION: Api must not reference Persistence directly"
            exit 1
          fi

      - name: "Check: Application does not use ProjectionsDbContext (.cs)"
        run: |
          if grep -r "ProjectionsDbContext" src/Tasks.Application/ --include="*.cs"; then
            echo "VIOLATION: Application must not use ProjectionsDbContext directly"
            exit 1
          fi

      - name: "Check: Application does not use EventsDbContext (.cs)"
        run: |
          if grep -r "EventsDbContext" src/Tasks.Application/ --include="*.cs"; then
            echo "VIOLATION: Application must not use EventsDbContext directly"
            exit 1
          fi

      - name: "Check: Application does not import Tasks.Persistence namespace (.cs)"
        run: |
          if grep -r "using Tasks.Persistence" src/Tasks.Application/ --include="*.cs"; then
            echo "VIOLATION: Application must not import Tasks.Persistence namespace"
            exit 1
          fi

      - name: "Check: All command handlers use Result pattern (.cs)"
        run: |
          VIOLATIONS=$(grep -rL "Result" src/Tasks.Application/UseCases/ --include="*Handler.cs")
          if [ -n "$VIOLATIONS" ]; then
            echo "VIOLATION: The following handlers do not use Result or Result<T>:"
            echo "$VIOLATIONS"
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Tasks.sln

      - name: Build
        run: dotnet build Tasks.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/Tasks.Tests/ --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~Integration"

  smoke-gate:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: localdefaultdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis/redis-stack:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Tasks.sln --configuration Release

      - name: Start API
        run: dotnet run --project src/Tasks.Api --no-build --configuration Release &
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Database=localdefaultdb;Username=appuser;Password=password123
          Redis__Server: localhost:6379
          ASPNETCORE_URLS: http://[::]:5006

      - name: Wait for API
        run: |
          until curl -sf http://localhost:5006/health/live; do
            sleep 2
          done
        timeout-minutes: 1

      - name: "Smoke gate: /health/ready"
        run: curl -sf http://localhost:5006/health/ready || exit 1
