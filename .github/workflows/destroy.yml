name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm destruction of all AWS infrastructure'
        required: true

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate confirmation
        if: github.event.inputs.confirm != 'destroy'
        run: |
          echo "Confirmation input must be exactly 'destroy'. Got: '${{ github.event.inputs.confirm }}'"
          exit 1

      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/environments/prod
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_container_image: placeholder:latest
          TF_VAR_migrations_image: placeholder:latest
        run: terraform init

      - name: Terraform Destroy
        working-directory: infra/environments/prod
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_container_image: placeholder:latest
          TF_VAR_migrations_image: placeholder:latest
        run: terraform destroy -auto-approve
