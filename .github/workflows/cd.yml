name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/Tasks.Api/Tasks.Api.csproj --configuration Release --output ./publish

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/environments/prod
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_container_image: placeholder:latest
        run: terraform init

      - name: Terraform Apply (bootstrap ECR)
        working-directory: infra/environments/prod
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_container_image: placeholder:latest
        run: terraform apply -target=module.ecs.aws_ecr_repository.this -auto-approve

      - name: Get ECR repository URL
        id: ecr-url
        working-directory: infra/environments/prod
        run: echo "url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REPOSITORY_URL: ${{ steps.ecr-url.outputs.url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REPOSITORY_URL:$IMAGE_TAG -t $ECR_REPOSITORY_URL:latest .
          docker push $ECR_REPOSITORY_URL:$IMAGE_TAG
          docker push $ECR_REPOSITORY_URL:latest

      - name: Terraform Apply (full deploy)
        working-directory: infra/environments/prod
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_container_image: ${{ steps.ecr-url.outputs.url }}:${{ github.sha }}
        run: terraform apply -auto-approve
